site_name: SILVA Networks
site_description: PyTorch layers, solvers, tutorials, and documentation for SILVA networks.
site_author: Dr. Jose Luis Silva
copyright: Copyright &copy; 2026 Dr. Jose Luis Silva. Released under the MIT License.
site_url: https://jseluis.github.io/silva-networks/
repo_url: https://github.com/jseluis/silva-networks
repo_name: jseluis/silva-networks

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/images/silva-networks-icon.svg
  favicon: assets/images/silva-networks-icon.svg
  features:
    - navigation.tracking
    - navigation.expand
    - navigation.path
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  palette:
    - scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

plugins:
  - search
  - mkdocs-jupyter:
      include_source: true
      execute: false
      ignore_h1_titles: false
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            line_length: 88
            separate_signature: true
            show_source: true

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: false
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/default-theme.js
  - javascripts/page-dates.js
  - javascripts/mathjax.js
  - javascripts/vendor/mathjax/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

