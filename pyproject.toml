[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silva-networks"
version = "1.0.0"
description = "PyTorch layers, solvers, tutorials, and documentation for SILVA networks and deep equilibrium models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dr. Jose Luis Silva" }]
keywords = [
  "deep equilibrium models",
  "implicit layers",
  "silva networks",
  "pytorch",
  "graph neural networks",
  "jacobians",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "certifi>=2024.2.2",
  "numpy>=1.24,<2.0",
  "torch>=2.2",
]

[project.optional-dependencies]
docs = [
  "mkdocs-material==9.*",
  "mkdocstrings[python]>=0.25",
  "mkdocs-jupyter>=0.24",
  "pymdown-extensions>=10.0",
]
examples = [
  "matplotlib>=3.7",
]
notebooks = [
  "ipykernel>=6.29",
  "jupyter>=1.1",
  "matplotlib>=3.7",
  "nbconvert>=7.16",
  "nbformat>=5.9",
]
graph = [
  "networkx>=3.0",
]
vision = [
  "torchvision>=0.17",
]
benchmarks = [
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "torch-geometric>=2.5",
  "torchvision>=0.17",
  "tqdm>=4.66",
]
optimization = [
  "cvxpy>=1.7.4; python_version >= '3.11'",
  "cvxpylayers>=1.0; python_version >= '3.11'",
]
dev = [
  "build>=1.2",
  "ipykernel>=6.29",
  "jupyter>=1.1",
  "matplotlib>=3.7",
  "nbconvert>=7.16",
  "nbformat>=5.9",
  "pytest>=7.4",
  "ruff>=0.5",
  "tomli>=2.0; python_version < '3.11'",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://jsluis.com"
Documentation = "https://jseluis.github.io/silva-networks"
Repository = "https://github.com/jseluis/silva-networks"
Issues = "https://github.com/jseluis/silva-networks/issues"
PyPI = "https://pypi.org/project/silva-networks/"
Archive = "https://doi.org/10.5281/zenodo.21770099"
Article = "https://doi.org/10.48550/arXiv.2607.28989"

[project.scripts]
silva-download-datasets = "silva_networks.dataset_cli:main"
silva-experiment = "silva_networks.public_experiments:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
silva_networks = ["py.typed", "configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "colab",
  "docs/**/*.ipynb",
  "notebooks",
  "tests_extended",
]
