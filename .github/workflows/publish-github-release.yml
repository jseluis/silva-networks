name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        default: v1.2.2
      title:
        description: Release title
        required: false
        default: SILVA Networks v1.2.2

permissions:
  contents: write

jobs:
  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git rev-parse --verify "refs/tags/${RELEASE_TAG}"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TITLE: ${{ inputs.title }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_TITLE}" --latest
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "${RELEASE_TITLE}" \
              --generate-notes \
              --latest
          fi
