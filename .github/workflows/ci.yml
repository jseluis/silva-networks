name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  tests:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[dev,examples]"
      - name: Check dependency metadata
        run: python -m pip check
      - name: Release audit
        run: python scripts/release_audit.py
      - name: Lint Python sources
        run: ruff check src tests examples scripts
      - name: Run tests with branch coverage
        if: matrix.python-version == '3.11'
        run: pytest tests tests_extended --cov=silva_networks --cov-report=term-missing -rs
      - name: Run tests
        if: matrix.python-version != '3.11'
        run: pytest tests tests_extended -rs

  latest-dependencies:
    name: Latest Compatible Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install latest compatible dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -e ".[dev,docs,examples,graph,vision]"
      - name: Check dependency metadata
        run: python -m pip check
      - name: Release audit
        run: python scripts/release_audit.py
      - name: Run tests
        run: pytest tests tests_extended -rs
      - name: Notebook smoke
        run: python scripts/run_notebook_smoke.py --timeout 180
      - name: Build docs
        run: mkdocs build --strict

  cli-smoke:
    name: CLI Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install smoke dependencies
        run: python -m pip install -e ".[dev,examples]"
      - name: Run CLI smoke
        run: bash scripts/smoke_test.sh

  optimization:
    name: Optimization Extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install optimization dependencies
        run: python -m pip install -e ".[dev,optimization]"
      - name: Check dependency metadata
        run: python -m pip check
      - name: Run optimization tests
        run: pytest tests/test_optimization.py -q -ra

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install docs dependencies
        run: python -m pip install -e ".[docs,notebooks,examples]"
      - name: Check dependency metadata
        run: python -m pip check
      - name: Release audit
        run: python scripts/release_audit.py
      - name: Notebook smoke
        run: python scripts/run_notebook_smoke.py --timeout 180
      - name: Build docs
        run: mkdocs build --strict

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install -e ".[dev]"
      - name: Check dependency metadata
        run: python -m pip check
      - name: Release audit
        run: python scripts/release_audit.py
      - name: Build package
        run: python -m build
      - name: Check package
        run: twine check dist/*
      - name: Install wheel artifact
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Smoke import wheel artifact
        run: >-
          python -c "import silva_networks;
          from silva_networks import SILVAFourierNeuralOperator"
