name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install release dependencies
        run: python -m pip install -e ".[dev,docs,examples,graph,vision]"
      - name: Release audit
        run: python scripts/release_audit.py
      - name: Lint Python sources
        run: ruff check src tests tests_extended examples scripts
      - name: Run complete test suite
        run: pytest tests tests_extended --cov=silva_networks --cov-report=term-missing -rs
      - name: Execute every canonical notebook
        run: >-
          python scripts/run_notebook_smoke.py
          notebooks/*.ipynb
          notebooks/package_api/*.ipynb
          notebooks/implicit_bridge/*.ipynb
          --timeout 180
      - name: Build documentation
        run: mkdocs build --strict
      - name: Build package
        run: python -m build
      - name: Check package metadata
        run: twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/silva-networks/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-github:
    name: Publish GitHub release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --title "SILVA Networks $GITHUB_REF_NAME"
          --generate-notes
