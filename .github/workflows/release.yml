name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install release dependencies
        run: python -m pip install -e ".[dev]"
      - name: Release audit
        run: python scripts/release_audit.py
      - name: Build package
        run: python -m build
      - name: Check package metadata
        run: twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/silva-networks/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-github:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --title "SILVA Networks $GITHUB_REF_NAME"
          --generate-notes
      - name: Remove superseded failed release runs
        env:
          GH_TOKEN: ${{ github.token }}
          SUPERSEDED_SHA: 4cc0f242180af6911b9c237f7facb4cd13f48809
        run: |
          for run_id in $(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?status=failure&per_page=100" --jq ".workflow_runs[] | select(.head_sha == \"${SUPERSEDED_SHA}\") | .id"); do
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          done
